<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI — Realtime</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e2f0;
      padding: 20px;
    }

    .card {
      width: 550px;
      max-width: 100%;
      padding: 45px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      color: #8888a0;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .voice-container { text-align: left; margin-bottom: 25px; }

    .label { font-size: 13px; color: #8d8da5; margin-bottom: 8px; }

    select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e2f0;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    select:focus { border-color: #6366f1; }
    select option { background: #1a1a2a; color: white; }

    button {
      padding: 13px 30px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    #callBtn {
      width: 100%;
      color: white;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    #callBtn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4); }

    #callBtn.live {
      color: #fecaca;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
    }

    .section { text-align: left; margin-top: 20px; }

    .box {
      min-height: 80px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d8d8e8;
      line-height: 1.5;
      word-break: break-word;
    }

    .interim { color: #8888a0; }

    #status { min-height: 25px; margin-top: 25px; color: #9999b0; font-size: 14px; }
    #status.success { color: #4ade80; }
    #status.error { color: #f87171; }

    .pulse {
      display: inline-block;
      width: 10px; height: 10px;
      margin-right: 8px;
      border-radius: 50%;
      background: #f87171;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    @media (max-width: 600px) {
      .card { padding: 30px 20px; }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Voice AI</h1>
    <div class="description">Just talk — it answers while you listen.</div>

    <div class="voice-container">
      <div class="label">Voice</div>
      <select id="voiceSelect"></select>
    </div>

    <button id="callBtn">Start talking</button>

    <div class="section">
      <div class="label">You</div>
      <div id="transcript" class="box">Your words appear here as you speak…</div>
    </div>

    <div class="section">
      <div class="label">Assistant</div>
      <div id="response" class="box">The answer streams in here…</div>
    </div>

    <div id="status">Not connected</div>

  </div>

  <script>
    const callBtn = document.getElementById("callBtn");
    const voiceSelect = document.getElementById("voiceSelect");
    const transcriptEl = document.getElementById("transcript");
    const responseEl = document.getElementById("response");
    const statusEl = document.getElementById("status");

    const FALLBACK_VOICES = ["flux-hannah-en", "flux-kit-en", "flux-alexis-en", "flux-cliff-en"];

    let ws = null;
    let micStream = null;
    let micCtx = null;
    let playCtx = null;

    let ttsRate = 24000;
    let nextTime = 0;
    let sources = [];
    let carry = new Uint8Array(0);

    let finalText = "";
    let answerText = "";

    function setStatus(html, type = "") {
      statusEl.className = type;
      statusEl.innerHTML = html;
    }

    function fillVoices(list) {
      voiceSelect.innerHTML = "";
      list.forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v.replace("flux-", "").replace("-en", "");
        opt.textContent = opt.textContent[0].toUpperCase() + opt.textContent.slice(1);
        voiceSelect.appendChild(opt);
      });
    }

    fillVoices(FALLBACK_VOICES);

    voiceSelect.onchange = () => {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: "config", voice: voiceSelect.value }));
      }
    };

    /* ---------- mic capture: 16 kHz PCM16 straight to the socket ---------- */

    const workletSource = `
      class PCMProcessor extends AudioWorkletProcessor {
        process(inputs) {
          const ch = inputs[0] && inputs[0][0];
          if (ch) {
            const out = new Int16Array(ch.length);
            for (let i = 0; i < ch.length; i++) {
              const s = Math.max(-1, Math.min(1, ch[i]));
              out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            this.port.postMessage(out.buffer, [out.buffer]);
          }
          return true;
        }
      }
      registerProcessor('pcm-processor', PCMProcessor);
    `;

    async function startMic() {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      micCtx = new AudioContext({ sampleRate: 16000 });

      const url = URL.createObjectURL(
        new Blob([workletSource], { type: "application/javascript" })
      );
      await micCtx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);

      const source = micCtx.createMediaStreamSource(micStream);
      const node = new AudioWorkletNode(micCtx, "pcm-processor");
      const silent = micCtx.createGain();
      silent.gain.value = 0;

      node.port.onmessage = (event) => {
        if (ws && ws.readyState === 1) ws.send(event.data);
      };

      source.connect(node);
      node.connect(silent);
      silent.connect(micCtx.destination);
    }

    /* ---------- playback: schedule PCM chunks back to back ---------- */

    function enqueueAudio(arrayBuffer) {
      let bytes = new Uint8Array(arrayBuffer);

      if (carry.length) {
        const merged = new Uint8Array(carry.length + bytes.length);
        merged.set(carry);
        merged.set(bytes, carry.length);
        bytes = merged;
        carry = new Uint8Array(0);
      }

      const usable = bytes.length - (bytes.length % 2);
      if (usable < bytes.length) carry = bytes.slice(usable);
      if (!usable) return;

      const pcm = new Int16Array(
        bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + usable)
      );

      const buffer = playCtx.createBuffer(1, pcm.length, ttsRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) channel[i] = pcm[i] / 32768;

      const node = playCtx.createBufferSource();
      node.buffer = buffer;
      node.connect(playCtx.destination);

      const now = playCtx.currentTime;
      if (nextTime < now + 0.06) nextTime = now + 0.06;

      node.start(nextTime);
      nextTime += buffer.duration;

      sources.push(node);
      node.onended = () => { sources = sources.filter((s) => s !== node); };
    }

    function stopPlayback() {
      sources.forEach((s) => { try { s.stop(); } catch (e) {} });
      sources = [];
      nextTime = 0;
      carry = new Uint8Array(0);
    }

    /* ---------- socket ---------- */

    function connect() {
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${scheme}://${location.host}/ws/voice`);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        setStatus('<span class="pulse"></span>Listening — start talking');
      };

      ws.onmessage = (event) => {
        if (typeof event.data !== "string") {
          enqueueAudio(event.data);
          return;
        }

        const msg = JSON.parse(event.data);

        if (msg.type === "ready") {
          ttsRate = msg.ttsSampleRate || ttsRate;
          if (msg.voices && msg.voices.length) {
            const current = voiceSelect.value;
            fillVoices(msg.voices);
            voiceSelect.value = msg.voices.includes(current) ? current : msg.voices[0];
          }
          ws.send(JSON.stringify({ type: "config", voice: voiceSelect.value }));
        }

        else if (msg.type === "transcript") {
          if (msg.final) {
            finalText = (finalText + " " + msg.text).trim();
            transcriptEl.textContent = finalText;
          } else {
            transcriptEl.innerHTML =
              finalText + ' <span class="interim">' + msg.text + "</span>";
          }
        }

        else if (msg.type === "user") {
          finalText = "";
          transcriptEl.textContent = msg.text;
          setStatus('<span class="pulse"></span>Thinking…');
        }

        else if (msg.type === "answer_start") {
          answerText = "";
          responseEl.textContent = "";
        }

        else if (msg.type === "token") {
          answerText += msg.text;
          responseEl.textContent = answerText;
        }

        else if (msg.type === "answer_end") {
          setStatus('<span class="pulse"></span>Listening — start talking');
        }

        else if (msg.type === "interrupt") {
          stopPlayback();
        }

        else if (msg.type === "error") {
          setStatus("Something went wrong: " + msg.message, "error");
        }
      };

      ws.onerror = () => setStatus("Connection failed. Check the server is running.", "error");
      ws.onclose = () => { if (micStream) hangUp(); };
    }

    async function startCall() {
      try {
        playCtx = new AudioContext();
        await playCtx.resume();
        await startMic();
        connect();

        callBtn.textContent = "Stop";
        callBtn.classList.add("live");
      } catch (error) {
        console.error(error);
        setStatus("Microphone permission denied or unavailable.", "error");
      }
    }

    function hangUp() {
      stopPlayback();

      if (ws && ws.readyState === 1) ws.close();
      ws = null;

      if (micStream) micStream.getTracks().forEach((t) => t.stop());
      micStream = null;

      if (micCtx) micCtx.close();
      micCtx = null;

      callBtn.textContent = "Start talking";
      callBtn.classList.remove("live");
      setStatus("Not connected");
    }

    callBtn.onclick = () => (micStream ? hangUp() : startCall());

    window.addEventListener("beforeunload", hangUp);
  </script>

</body>

</html>
